<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" fill="none">
  <!-- Squircle bubble icon at top left -->
  <rect x="24" y="24" width="34" height="30" rx="8" fill="#00A854" />
  
  <!-- Radar / ping broadcast arcs below the squircle -->
  <path d="M50 58 C 54 58, 57 61, 57 65" stroke="#00A854" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M46 62 C 48 62, 50 64, 50 66" stroke="#00A854" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- "AD" in deep teal / pine green -->
  <text x="64" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" fill="#01594F">AD</text>

  <!-- "Ping" in vibrant green -->
  <text x="172" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.5" fill="#00A854">Ping</text>

  <!-- Underline divider below wordmark -->
  <line x1="112" y1="104" x2="318" y2="104" stroke="#01594F" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Tagline: "REACH. ENGAGE. CONVERT." -->
  <text x="215" y="126" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4.5" fill="#01594F">REACH. ENGAGE. CONVERT.</text>
</svg>
